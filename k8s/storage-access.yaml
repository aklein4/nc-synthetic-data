# Temporary shell access to persistent artifacts; requests no GPU.
apiVersion: v1
kind: Pod
metadata:
  name: nc-synthetic-data-storage
  namespace: default
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 3600
  nodeSelector:
    node-role.kubernetes.io/cpu: ""
  containers:
    - name: storage
      image: python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
      command: [sleep, "3600"]
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 512Mi}
      volumeMounts:
        - {name: shared, mountPath: /mnt/shared}
  volumes:
    - name: shared
      hostPath: {path: /mnt/shared, type: Directory}
